# The template's own tasks, which mise loads along with mise.toml. Only the
# template repository has this file: copier.yml leaves it out of projects.

[tasks."template:check"]
description = "Check that the project Copier creates with every language equals the repository root, apart from the template's own files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT

# --vcs-ref=HEAD makes copier read the working tree, including uncommitted
# changes and untracked files that git doesn't ignore. template_repository
# adds the lines for the template's own files to .github/CODEOWNERS.
copier copy --quiet --trust --defaults --vcs-ref=HEAD --data template_repository=true \
  --data python=true --data rust=true --data typescript=true --data cpp=true \
  . "$work/project"
rm "$work/project/.copier-answers.yml"

# Copy the files copier read, except the template's own files, which
# _exclude in copier.yml also lists, and templates (*.jinja), which the
# project has rendered instead.
mkdir "$work/root"
git ls-files --cached --others --exclude-standard | sort -u | while read -r file; do
  case $file in
    copier.yml | .config/mise/conf.d/template.toml | .github/workflows/template.yml | .github/rulesets/template-checks.json | .github/README.md | docs/template-plan.md | *.jinja) ;;
    *) if [[ -e $file ]]; then printf '%s\n' "$file"; fi ;;
  esac
done | tar -cf - -T - | tar -xf - -C "$work/root"

if ! diff -r "$work/root" "$work/project"; then
  echo "error: the project Copier creates with every language differs from the repository root as shown above (root first), but the root must be that project. List a file only the root has in _exclude in copier.yml and in this task in .config/mise/conf.d/template.toml; for a file with a .jinja twin, edit the twin and run \`mise run template:sync\`." >&2
  exit 1
fi
echo "The project Copier creates with every language equals the repository root, apart from the template's own files."
'''

[tasks."template:sync"]
description = "Render each .jinja twin with every language into its root copy, such as AGENTS.md.jinja into AGENTS.md"
run = '''
#!/usr/bin/env bash
set -euo pipefail
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
# As in template:check.
copier copy --quiet --trust --defaults --vcs-ref=HEAD --data template_repository=true \
  --data python=true --data rust=true --data typescript=true --data cpp=true \
  . "$work/project"

# A twin is a .jinja file whose root copy exists; the answers file's
# template has none.
git ls-files --cached --others --exclude-standard '*.jinja' | while read -r twin; do
  root_copy=${twin%.jinja}
  if [[ -e $root_copy ]]; then
    cp "$work/project/$root_copy" "$root_copy"
    echo "Rendered $twin into $root_copy."
  fi
done
'''

[tasks."lint:template"]
description = "Run template:check, so that lint and check include it"
depends = ["template:check"]

[tasks."template:check-update"]
description = "Check that copier update gives a project what a new copy gives: each variant created from origin/main and updated to the working tree, a Python project given Rust, and a project from origin/main given a name; needs origin/main, so check doesn't run it"
run = '''
#!/usr/bin/env bash
set -euo pipefail
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
# copier update needs each project committed, and CI's git has no identity.
export GIT_AUTHOR_NAME=template-check GIT_AUTHOR_EMAIL=template-check@localhost
export GIT_COMMITTER_NAME=$GIT_AUTHOR_NAME GIT_COMMITTER_EMAIL=$GIT_AUTHOR_EMAIL
# Since git 2.55 (CI's version), "git commit" starts "git maintenance run
# --auto --detach", which keeps running in the background after the commit
# and holds .git/objects/maintenance.lock until it has run. copier makes
# temporary repositories and deletes them later, so turn automatic
# maintenance off to leave nothing running in them. This replaces any
# GIT_CONFIG_COUNT the caller set.
export GIT_CONFIG_COUNT=2
export GIT_CONFIG_KEY_0=gc.auto GIT_CONFIG_VALUE_0=0
export GIT_CONFIG_KEY_1=maintenance.auto GIT_CONFIG_VALUE_1=false

# copier update rereads the commit a project was created from, so the
# working tree must be a commit: make it one in a clone that shares this
# repository's objects. The template's path must be absolute, because copier
# records it in each project.
template=$work/template
git clone --quiet --shared --no-checkout . "$template"
git -C "$template" --work-tree="$PWD" add --all
git -C "$template" --work-tree="$PWD" commit --quiet --allow-empty --message "The working tree"
working_tree=$(git -C "$template" rev-parse HEAD)
main=$(git rev-parse origin/main)

# create <project> <commit> <copier options>: create a project and commit it.
create() {
  local project=$1 commit=$2
  shift 2
  copier copy --quiet --trust --defaults --vcs-ref="$commit" "$@" "$template" "$project"
  git -C "$project" init --quiet
  git -C "$project" add --all
  git -C "$project" commit --quiet --message "Create the project"
}

# update <project> <copier update options>: run copier update on a committed
# project. Once in about 160 updates in CI (1 of 33 Template runs, run
# 38577039801), copier finishes its work and then exits with
# "OSError: [Errno 39] Directory not empty: '.git'" (macOS numbers it 66),
# because Python can't delete the temporary clone it made. The next run
# failed the same way for 'objects' (run 38617549987), so the directory is not
# part of the match. The traceback of this failure passes through
# tempfile.py's cleanup, which only deletes copier's own temporary
# directories. The git settings above should prevent it, and this retries
# once, only on that traceback, as a second defence: any other failure, and a
# second occurrence of this one, fails the task. The first attempt has already
# changed the project, so the retry first restores the committed state.
update() {
  local project=$1 stderr_file=$work/update_stderr
  shift
  if copier update --quiet --trust --defaults "$@" "$project" 2> "$stderr_file"; then
    cat "$stderr_file" >&2
    return 0
  fi
  cat "$stderr_file" >&2
  if ! grep -qE 'tempfile\.py", line [0-9]+, in cleanup' "$stderr_file" ||
    ! grep -qE "OSError: .*Directory not empty: " "$stderr_file"; then
    return 1
  fi
  echo "copier update failed to delete its temporary directory (see the error above); retrying once." >&2
  git -C "$project" reset --quiet --hard
  git -C "$project" clean --quiet --force -d -x
  copier update --quiet --trust --defaults "$@" "$project"
}

failures=0
# expect_equal <test name> <updated project> <new project>
expect_equal() {
  if diff -r --exclude=.git "$2" "$3"; then
    echo "$1: passed."
  else
    echo "FAIL: $1: the updated project differs from the new one as shown above (updated first)." >&2
    failures=$((failures + 1))
  fi
  rm -rf "$2" "$3"
}

name=a_project_created_from_main_and_updated_equals_one_created_from_the_working_tree
for languages in "python rust typescript cpp" python rust typescript cpp; do
  data=$(printf -- '--data %s=true ' $languages)
  create "$work/updated" "$main" $data
  update "$work/updated" --vcs-ref="$working_tree"
  # copier update doesn't delete a file that the template starts to exclude,
  # and a main that predates the exclusion of docs/template-plan.md still
  # creates it. Delete this line once main excludes the file.
  rm -f "$work/updated/docs/template-plan.md"
  create "$work/new" "$working_tree" $data
  expect_equal "$name ($languages)" "$work/updated" "$work/new"
done

name=adding_rust_to_a_python_project_with_copier_update_equals_a_new_python_and_rust_project
create "$work/updated" "$working_tree" --data python=true
update "$work/updated" --vcs-ref="$working_tree" --data rust=true
create "$work/new" "$working_tree" --data python=true --data rust=true
expect_equal "$name" "$work/updated" "$work/new"

name=naming_a_project_from_main_with_copier_update_equals_a_new_project_with_that_name
create "$work/updated" "$main" --data python=true --data rust=true --data typescript=true --data cpp=true
# A project from a main with the name and owner questions has recorded
# package_name and github_repository, which a new project_name doesn't
# change, so this gives all three.
update "$work/updated" --vcs-ref="$working_tree" --data project_name=my-project --data package_name=my_project --data github_repository=arjunbhargava/my-project
# As in the first test; delete it with that line.
rm -f "$work/updated/docs/template-plan.md"
create "$work/new" "$working_tree" --data python=true --data rust=true --data typescript=true --data cpp=true --data project_name=my-project
expect_equal "$name" "$work/updated" "$work/new"
exit $((failures > 0))
'''

[tasks."test:template"]
description = "Check that Copier refuses a project with no language and writes nothing, refuses a malformed project name, package name, GitHub owner or repository, copyright holder, or year, and renders each .jinja twin in place of its root copy; that template:sync writes each twin's render over its root copy; that a project with one language has only that language's files, names, and Dependabot entries; that no project has the template's own files or README text and the Python project's docs build passes and its sidebar lists the operating guide as one entry; that a Python project that is a uv workspace runs and documents every member, though two members' test files share a name, and its docs build fails on an undocumented function in a member; that mutate succeeds in a project with only C and C++, and otherwise runs each mutate:<language> task with the arguments after --; that a project named my-project names foundation only in links to the template, and one with another owner and copyright holder names neither the root's nor a template-only file in CODEOWNERS and links its own repository's settings; and that template:check-update retries copier update once, and only on copier's temporary-directory error, and turns off automatic git maintenance"
run = '''
#!/usr/bin/env bash
set -euo pipefail
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
name=copier_refuses_a_project_with_no_language_and_writes_nothing

status=0
copier copy --quiet --trust --defaults --vcs-ref=HEAD \
  --data python=false --data rust=false --data typescript=false --data cpp=false \
  . "$work/project" 2> "$work/stderr" || status=$?
if ((status == 0)) || ! grep -q "No language was chosen" "$work/stderr"; then
  echo "FAIL: $name: copier exited with status $status and printed the output below; expected a non-zero status and the error from the validator of cpp in copier.yml." >&2
  cat "$work/stderr" >&2
  exit 1
fi
if [[ -e $work/project ]]; then
  echo "FAIL: $name: copier refused, but wrote $work/project." >&2
  exit 1
fi
echo "$name: passed."

name=copier_refuses_a_malformed_name_owner_repository_copyright_holder_or_year
for answer in project_name=My-Project project_name=my--project project_name=1project \
  project_name=my-project- "project_name=my project" package_name=my-package package_name=my__package \
  github_owner=@octocat github_owner=a/b/c "github_owner=my org" "copyright_holder= " copyright_year=26 copyright_year=2O26 \
  github_repository=my-project github_repository=a/b/c; do
  status=0
  copier copy --quiet --trust --defaults --vcs-ref=HEAD --data python=true --data "$answer" \
    . "$work/project" 2> "$work/stderr" || status=$?
  if ((status == 0)) || ! grep -q "Validation error for question '${answer%%=*}'" "$work/stderr"; then
    echo "FAIL: $name: for --data \"$answer\", copier exited with status $status and printed the output below; expected the error from the validator of ${answer%%=*} in copier.yml." >&2
    cat "$work/stderr" >&2
    exit 1
  fi
done
echo "$name: passed."

# template:check can't see which file Copier used while a twin's render
# equals its root copy, so this test copies the template and adds a line to
# each twin that its root copy lacks.
name=copier_renders_each_twin_in_place_of_its_root_copy
mkdir "$work/template"
git ls-files --cached --others --exclude-standard | while read -r file; do
  if [[ -e $file ]]; then printf '%s\n' "$file"; fi
done | tar -cf - -T - | tar -xf - -C "$work/template"
# A twin is a .jinja file whose root copy exists, as in template:sync.
twins=$(git ls-files --cached --others --exclude-standard '*.jinja' | while read -r twin; do
  if [[ -e ${twin%.jinja} ]]; then printf '%s\n' "$twin"; fi
done)
if [[ -z $twins ]]; then
  echo "FAIL: $name: found no .jinja twin with a root copy, but AGENTS.md, README.md, NOTICE, .github/CODEOWNERS, and .github/dependabot.yml each have one." >&2
  exit 1
fi
marker="This line is only in the twin."
for twin in $twins; do
  printf '%s\n' "$marker" >> "$work/template/$twin"
done
copier copy --quiet --trust --defaults --data python=true "$work/template" "$work/twins"
for twin in $twins; do
  if [[ $(tail -n 1 "$work/twins/${twin%.jinja}") != "$marker" ]]; then
    echo "FAIL: $name: the project's ${twin%.jinja} is its root copy, not the render of $twin." >&2
    exit 1
  fi
done
echo "$name: passed."

# template:sync reads the template from git, so this test runs it in a git
# repository made from the copy of the template whose twins end with the
# marker. MISE_TRUSTED_CONFIG_PATHS lets mise read that repository's tasks.
name=template_sync_writes_each_twin_render_over_its_root_copy
git -C "$work/template" init --quiet
git -C "$work/template" add --all
git -C "$work/template" -c user.name=template-test -c user.email=template-test@localhost \
  commit --quiet --message "The template, with a line added to each twin"
MISE_TRUSTED_CONFIG_PATHS=$work/template mise --cd "$work/template" run template:sync > /dev/null
for twin in $twins; do
  if [[ $(tail -n 1 "$work/template/${twin%.jinja}") != "$marker" ]]; then
    echo "FAIL: $name: after template:sync, ${twin%.jinja} lacks the line that $twin ends with." >&2
    exit 1
  fi
done
echo "$name: passed."

# What each language adds to a project: its files, which _exclude in
# copier.yml leaves out of a project without it (keep each list equal to its
# block there), its name in AGENTS.md and README.md, and its entries in
# .github/dependabot.yml.
language_files() {
  case $1 in
    python) echo pyproject.toml uv.lock .python-version conftest.py src tests .config/mise/conf.d/python.toml docs/api/python.md ;;
    rust) echo Cargo.toml Cargo.lock rust-toolchain.toml crates .config/mise/conf.d/rust.toml docs/api/rust.md .github/workflows/rust-advisories.yml ;;
    typescript) echo package.json pnpm-lock.yaml pnpm-workspace.yaml packages tsconfig.json biome.json .dependency-cruiser.cjs stryker.config.json .config/mise/conf.d/typescript.toml docs/api/typescript.md ;;
    cpp) echo CMakeLists.txt cpp CMakePresets.json .clang-format .clang-tidy Doxyfile .config/mise/conf.d/cpp.toml docs/api/cpp.md ;;
  esac
}
language_name() {
  case $1 in
    python) echo Python ;;
    rust) echo Rust ;;
    typescript) echo TypeScript ;;
    cpp) echo C++ ;;
  esac
}
language_dependabot_entries() {
  case $1 in
    python) echo "uv /" ;;
    rust) printf '%s\n' "cargo /" "rust-toolchain /" ;;
    typescript) echo "npm /" ;;
  esac
}

# Prints each entry of a dependabot.yml as "<ecosystem> <directory>", one
# line per directory, sorted.
dependabot_entries() {
  awk '
    $2 == "package-ecosystem:" { ecosystem = $3 }
    $1 == "directory:" { print ecosystem, $2 }
    $1 == "directories:" { gsub(/[][,]/, ""); for (i = 2; i <= NF; i++) print ecosystem, $i }
  ' "$1" | sort
}

name=a_single_language_project_has_only_its_language_files_names_and_dependabot_entries
languages="python rust typescript cpp"
for language in $languages; do
  project=$work/$language
  copier copy --quiet --trust --defaults --vcs-ref=HEAD --data "$language=true" . "$project"
  for path in $(language_files "$language"); do
    if [[ ! -e $project/$path ]]; then
      echo "FAIL: $name: the $language project lacks $path, one of its own files." >&2
      exit 1
    fi
  done
  for other in $languages; do
    if [[ $other == "$language" ]]; then continue; fi
    for path in $(language_files "$other"); do
      if [[ -e $project/$path ]]; then
        echo "FAIL: $name: the $language project has $path, a file of $other. Add it to the $other block of _exclude in copier.yml." >&2
        exit 1
      fi
    done
    if grep -nF "$(language_name "$other")" "$project/AGENTS.md" "$project/README.md" >&2; then
      echo "FAIL: $name: the $language project's AGENTS.md or README.md names $(language_name "$other") on the lines above. Put those lines inside an if block for $other in the .jinja twin." >&2
      exit 1
    fi
  done
  expected_entries=$({ printf '%s\n' "github-actions /" "uv /docs"; language_dependabot_entries "$language"; } | sort)
  actual_entries=$(dependabot_entries "$project/.github/dependabot.yml")
  if [[ $actual_entries != "$expected_entries" ]]; then
    printf "FAIL: %s: the %s project's .github/dependabot.yml has these entries:\n%s\nIt should have these:\n%s\n" "$name" "$language" "$actual_entries" "$expected_entries" >&2
    exit 1
  fi
done
echo "$name: passed."

# A project with only C and C++ has no mutate:<language> task, because those
# languages have no mutation tool, and mutate must still succeed.
name=mutate_succeeds_in_a_project_with_only_cpp
mutate_output=$(MISE_TRUSTED_CONFIG_PATHS=$work/cpp mise --cd "$work/cpp" run mutate 2>&1) || {
  echo "FAIL: $name: mise run mutate failed in the C++ project with the output below; mutate in mise.toml must succeed when no language defines a mutate:<language> task." >&2
  echo "$mutate_output" >&2
  exit 1
}
if ! grep -q "No language with a mutation tool is present" <<< "$mutate_output"; then
  echo "FAIL: $name: mise run mutate in the C++ project succeeded but did not say that no language with a mutation tool is present; its output is below." >&2
  echo "$mutate_output" >&2
  exit 1
fi
echo "$name: passed."

# A language with a mutation tool defines mutate:<language>; a fake one in the
# C++ project stands in for it, so that no mutation tool has to run.
name=mutate_runs_each_language_task_and_passes_it_the_arguments_after_the_separator
cat > "$work/cpp/.config/mise/conf.d/fake_language.toml" <<'FAKE'
[tasks."mutate:fake"]
run = "echo fake mutation tool called with:"
FAKE
for arguments in "" "origin/release"; do
  mutate_output=$(MISE_TRUSTED_CONFIG_PATHS=$work/cpp mise --cd "$work/cpp" run mutate -- $arguments 2>&1) || {
    echo "FAIL: $name: mise run mutate -- $arguments failed in the C++ project with a fake mutate:fake task; its output is below." >&2
    echo "$mutate_output" >&2
    exit 1
  }
  if ! grep -qx "fake mutation tool called with:${arguments:+ $arguments}" <<< "$mutate_output"; then
    echo "FAIL: $name: mise run mutate -- $arguments did not run mutate:fake with the arguments \"$arguments\"; its output is below." >&2
    echo "$mutate_output" >&2
    exit 1
  fi
done
rm "$work/cpp/.config/mise/conf.d/fake_language.toml"
echo "$name: passed."

# The files that only describe or check the template, which _exclude in
# copier.yml leaves out of every project (keep this list equal to the one
# there). The Python project's docs build fails on a link or toctree entry to
# a page that the project lacks.
name=a_project_has_no_template_only_file_and_its_docs_build_passes
for language in $languages; do
  for path in .config/mise/conf.d/template.toml .github/workflows/template.yml .github/rulesets/template-checks.json .github/README.md docs/template-plan.md; do
    if [[ -e $work/$language/$path ]]; then
      echo "FAIL: $name: the $language project has $path, a file that only describes or checks the template. Add it to _exclude in copier.yml." >&2
      exit 1
    fi
  done
  if grep -nE 'Get started|template-plan' "$work/$language/README.md" >&2; then
    echo "FAIL: $name: the $language project's README.md has the template's text on the lines above. Put it in .github/README.md, the template's own README." >&2
    exit 1
  fi
done
if ! (cd "$work/python" && bash docs/build.sh > "$work/docs_build.log" 2>&1); then
  echo "FAIL: $name: the Python project's docs build failed; its output is below." >&2
  cat "$work/docs_build.log" >&2
  exit 1
fi
echo "$name: passed."

# The pages that docs/operating-guide.md lists belong in its toctree, so the
# top level of the sidebar holds the project's own pages, the API reference,
# and the one entry for the operating guide. Furo writes each top-level entry
# as a toctree-l1 list item, and the pages under an entry as toctree-l2. The
# page body repeats the toctrees, so only the sidebar's markup is read.
name=a_projects_sidebar_lists_the_operating_guide_as_one_entry
top_level_entries=$(sed -n '/class="sidebar-tree"/,/<\/aside>/p' "$work/python/docs/_build/html/index.html" \
  | grep -o 'class="toctree-l1[^"]*"><a class="reference internal" href="[^"]*">[^<]*' | sed 's/.*">//')
if [[ $(grep -cx 'Operating guide' <<< "$top_level_entries") -ne 1 ]]; then
  printf 'FAIL: %s: the top level of the Python project'"'"'s sidebar should have "Operating guide" once, and has:\n%s\n' "$name" "$top_level_entries" >&2
  exit 1
fi
for page_title in "Agent instructions" "Agent rules and skills" "Auto mode" "Orchestrating long-running agent work" \
  "Linear conventions" "The setup script" "Pull template updates"; do
  if grep -qx "$page_title" <<< "$top_level_entries"; then
    printf 'FAIL: %s: the top level of the Python project'"'"'s sidebar lists "%s", which belongs under "Operating guide". Put its page in the toctree of docs/operating-guide.md.\n' "$name" "$page_title" >&2
    exit 1
  fi
done
echo "$name: passed."

# A Python project that is a uv workspace, named foundation or otherwise, gets
# its tests and its API pages, and the docs build's docstring check, from the
# members listed in pyproject.toml. The two members' test files share a name,
# which pytest's default import mode rejects. The second member holds no
# function, so the check below that fails on an undocumented function needs a
# new one, and the third has no src/, which the docs build and the tests skip.
name=a_uv_workspace_project_tests_and_documents_every_member
for project_name in foundation my-project; do
  package=${project_name//-/_}
  project=$work/workspace_$package
  copier copy --quiet --trust --defaults --vcs-ref=HEAD --data python=true --data "project_name=$project_name" . "$project"
  (
    cd "$project"
    for member in first second; do
      mkdir -p "$member/src/member_$member" "$member/tests"
      printf '[project]\nname = "member-%s"\nversion = "0.1.0"\nrequires-python = ">=3.12"\ndependencies = []\n\n[build-system]\nrequires = ["uv_build>=0.12.23,<0.13.0"]\nbuild-backend = "uv_build"\n' "$member" > "$member/pyproject.toml"
      touch "$member/src/member_$member/py.typed"
      printf 'def test_%s_member_runs() -> None:\n    pass\n' "$member" > "$member/tests/test_member.py"
      awk -v package="$package" -v page="python/member_$member/index" '{ print } $0 == "python/" package "/index" { print page }' docs/api/python.md > docs/api/python.md.new
      mv docs/api/python.md.new docs/api/python.md
    done
    printf '"""The first member."""\n\n\ndef double(value: int) -> int:\n    """Return twice the value.\n\n    Args:\n        value: The number to double.\n\n    Returns:\n        The value times 2.\n\n    Examples:\n        >>> double(2)\n        4\n    """\n    return value * 2\n' > first/src/member_first/__init__.py
    printf '"""The second member, which has no function."""\n' > second/src/member_second/__init__.py
    mkdir third
    printf '[project]\nname = "member-third"\nversion = "0.1.0"\nrequires-python = ">=3.12"\ndependencies = []\n' > third/pyproject.toml
    printf '\n[tool.uv.workspace]\nmembers = ["first", "second", "third"]\n' >> pyproject.toml
    uv lock --quiet
    uv sync --quiet --locked --all-packages
  ) > "$work/workspace_setup.log" 2>&1 || { cat "$work/workspace_setup.log" >&2; exit 1; }
  # pytest exits non-zero when a file fails to collect, which the loop below reports.
  collected_tests=$(cd "$project" && uv run pytest --collect-only -q 2>&1) || true
  for expected in first/tests/test_member.py::test_first_member_runs second/tests/test_member.py::test_second_member_runs first/src/member_first/__init__.py::member_first.double; do
    if [[ $collected_tests != *"$expected"* ]]; then
      echo "FAIL: $name ($project_name): pytest in the workspace didn't collect $expected; it collected:" >&2
      echo "$collected_tests" >&2
      exit 1
    fi
  done
  if ! (cd "$project" && bash docs/build.sh > "$work/workspace_docs_build.log" 2>&1); then
    echo "FAIL: $name ($project_name): the workspace's docs build failed; its output is below." >&2
    cat "$work/workspace_docs_build.log" >&2
    exit 1
  fi
  for member in first second; do
    if [[ ! -f $project/docs/_build/html/api/python/member_$member/index.html ]]; then
      echo "FAIL: $name ($project_name): the docs have no API page for member_$member." >&2
      exit 1
    fi
  done
  printf '\n\ndef undocumented(value: int) -> int:\n    return value\n' >> "$project/first/src/member_first/__init__.py"
  if (cd "$project" && bash docs/build.sh > "$work/workspace_docs_build.log" 2>&1) || ! grep -q "first/src/member_first/__init__.py" "$work/workspace_docs_build.log"; then
    echo "FAIL: $name ($project_name): the docs build didn't fail on an undocumented function in the first member; its output is below." >&2
    cat "$work/workspace_docs_build.log" >&2
    exit 1
  fi
done
echo "$name: passed."

# The root's name, foundation, is left in a project named otherwise only
# where it means the template: in links to the template's repository,
# arjunbhargava/foundation, and in docs/template-updates.md, which says how a
# project created before the name questions adopts them.
# .copier-answers.yml records the template's path.
name=a_renamed_project_has_no_file_or_line_with_the_template_name
for languages in "python rust typescript cpp" $languages; do
  project=$work/renamed
  data=$(printf -- '--data %s=true ' $languages)
  copier copy --quiet --trust --defaults --vcs-ref=HEAD $data --data project_name=my-project . "$project"
  leftover_paths=$(cd "$project" && find . -iname '*foundation*')
  leftover_lines=$(cd "$project" && grep -rniI --exclude=.copier-answers.yml --exclude=template-updates.md foundation . | grep -v 'arjunbhargava/foundation' || true)
  if [[ -n $leftover_paths$leftover_lines ]]; then
    printf 'FAIL: %s: the %s project named my-project still names foundation in these paths and lines:\n%s\n%s\nAdd each to _tasks in copier.yml, or use project_name or package_name in its .jinja twin.\n' \
      "$name" "$languages" "$leftover_paths" "$leftover_lines" >&2
    exit 1
  fi
  rm -rf "$project"
done
echo "$name: passed."

# A name left as foundation keeps its directory: the crate's, here.
name=a_project_that_renames_only_its_package_keeps_the_crate
project=$work/package_only
copier copy --quiet --trust --defaults --vcs-ref=HEAD --data rust=true --data python=true \
  --data package_name=my_package . "$project"
for path in crates/foundation/Cargo.toml src/my_package/__init__.py; do
  if [[ ! -e $project/$path ]]; then
    echo "FAIL: $name: the project with package_name=my_package lacks $path." >&2
    exit 1
  fi
done
rm -rf "$project"
echo "$name: passed."

# The root's owner and copyright holder are left in a project with others
# only in links to the template's repository, arjunbhargava/foundation, and
# in docs/template-updates.md, which gives the defaults.
name=a_project_names_its_own_owner_and_copyright_holder_and_no_template_only_file_in_codeowners
project=$work/owned
copier copy --quiet --trust --defaults --vcs-ref=HEAD \
  --data python=true --data rust=true --data typescript=true --data cpp=true \
  --data github_owner=my-org/maintainers --data "copyright_holder=Jane Doe" --data copyright_year=2030 \
  . "$project"
codeowners=$project/.github/CODEOWNERS
if grep -v -e '^#' -e '^$' "$codeowners" | grep -v ' @my-org/maintainers$' >&2; then
  echo "FAIL: $name: the lines above of the project's CODEOWNERS name an owner other than its github_owner, my-org/maintainers. Use github_owner in .github/CODEOWNERS.jinja." >&2
  exit 1
fi
if grep -E '\.jinja |^/copier\.yml ' "$codeowners" >&2; then
  echo "FAIL: $name: the project's CODEOWNERS lists the files above, which only the template has. Put them inside the template_repository block of .github/CODEOWNERS.jinja." >&2
  exit 1
fi
if (cd "$project" && grep -rniI --exclude=.copier-answers.yml --exclude=template-updates.md -e arjun . | grep -v 'arjunbhargava/foundation' >&2); then
  echo "FAIL: $name: the lines above name the root's owner or copyright holder. Use github_owner or copyright_holder in their .jinja twin." >&2
  exit 1
fi
# github_repository defaults to the owner's organization and project_name.
if grep -n 'github\.com/[^/ )]*/[^/ )]*/settings' "$project/README.md" | grep -v 'github\.com/my-org/foundation/settings' >&2; then
  echo "FAIL: $name: the README's settings links above aren't for my-org/foundation, the project's github_repository. Use github_repository in README.md.jinja." >&2
  exit 1
fi
copyright_line=$(sed -n 2p "$project/NOTICE")
if [[ $copyright_line != "Copyright 2030 Jane Doe" ]]; then
  echo "FAIL: $name: the project's NOTICE says \"$copyright_line\", not \"Copyright 2030 Jane Doe\". Use copyright_year and copyright_holder in NOTICE.jinja." >&2
  exit 1
fi
rm -rf "$project"
echo "$name: passed."

# template:check-update's update function, sourced here with a shell function
# in place of copier. The fake fails the calls that copier_errors names, with
# the error each holds ("" succeeds), and changes a tracked file and adds an
# untracked one, as a real update does before it fails.
name=update_retries_once_and_only_on_copiers_temporary_directory_error
sed -n '/^update() {$/,/^}$/p' .config/mise/conf.d/template.toml > "$work/update_function.sh"
if [[ ! -s $work/update_function.sh ]]; then
  echo "FAIL: $name: found no update function in .config/mise/conf.d/template.toml; it must start with \"update() {\" and end with \"}\" at the start of a line." >&2
  exit 1
fi
source "$work/update_function.sh"

update_project=$work/update_project
git init --quiet "$update_project"
echo "from the template" > "$update_project/tracked_file"
git -C "$update_project" add tracked_file
git -C "$update_project" -c user.name=template-test -c user.email=template-test@localhost \
  commit --quiet --allow-empty --message "Create the project"

copier_errors=()
copier_calls=0
retried_a_changed_project=false
copier() {
  local error=${copier_errors[copier_calls]:-}
  copier_calls=$((copier_calls + 1))
  if ((copier_calls > 1)) && [[ -n $(git -C "$update_project" status --porcelain) ]]; then
    retried_a_changed_project=true
  fi
  echo "changed by copier" >> "$update_project/tracked_file"
  touch "$update_project/untracked_file"
  if [[ -n $error ]]; then
    echo "$error" >&2
    return 1
  fi
}

# expect_update <case> <expected status> <expected copier calls> <error of each call>...
expect_update() {
  local case=$1 expected_status=$2 expected_calls=$3 status=0
  shift 3
  copier_errors=("$@")
  copier_calls=0
  retried_a_changed_project=false
  git -C "$update_project" reset --quiet --hard
  git -C "$update_project" clean --quiet --force -d -x
  update "$update_project" --vcs-ref=unused 2> /dev/null || status=$?
  if ((status != expected_status || copier_calls != expected_calls)); then
    echo "FAIL: $name ($case): update returned $status after $copier_calls copier calls; expected $expected_status after $expected_calls." >&2
    exit 1
  fi
  if [[ $retried_a_changed_project == true ]]; then
    echo "FAIL: $name ($case): update retried without restoring the project, which the failed attempt had changed." >&2
    exit 1
  fi
}

# The traceback tail copier 9.18.2 prints on Python 3.12 when a temporary
# directory's cleanup raises the given error; line numbers vary by version.
cleanup_traceback() {
  printf '%s\n' \
    'Traceback (most recent call last):' \
    '  File "/usr/lib/python3.12/tempfile.py", line 1089, in cleanup' \
    '    self._rmtree(self.name, ignore_errors=self._ignore_cleanup_errors)' \
    "$1"
}
# What separates a retried failure from one that is not: the traceback goes
# through tempfile.py's cleanup, so the directory is in a temporary directory
# copier made. The same error from elsewhere, such as copier writing into the
# project's own src, is not a cleanup race.
not_a_cleanup_traceback=$(printf '%s\n' \
  'Traceback (most recent call last):' \
  '  File "copier/_main.py", line 1, in _copy_file' \
  "OSError: [Errno 39] Directory not empty: 'src'")
git_error=$(cleanup_traceback "OSError: [Errno 39] Directory not empty: '.git'")
objects_error=$(cleanup_traceback "OSError: [Errno 39] Directory not empty: 'objects'")
expect_update the_git_directory_error_once_then_success 0 2 "$git_error" ""
expect_update the_macos_error_once_then_success 0 2 "$(cleanup_traceback "OSError: [Errno 66] Directory not empty: '.git'")" ""
expect_update the_objects_directory_error_once_then_success 0 2 "$objects_error" ""
expect_update another_cleanup_error 1 1 "$(cleanup_traceback "OSError: [Errno 13] Permission denied: '.git'")"
expect_update the_directory_not_empty_error_outside_a_cleanup 1 1 "$not_a_cleanup_traceback"
expect_update the_cleanup_error_twice 1 2 "$git_error" "$objects_error"
unset -f copier
echo "$name: passed."

# template:check-update's git settings, taken from the task and applied in a
# subshell: a commit in a new repository must not start git maintenance.
name=template_check_update_turns_off_automatic_git_maintenance
sed -n '/^export GIT_CONFIG_COUNT=/,/^export GIT_CONFIG_KEY_1=/p' .config/mise/conf.d/template.toml > "$work/git_settings.sh"
if [[ $(wc -l < "$work/git_settings.sh") -ne 3 ]]; then
  echo "FAIL: $name: found $(wc -l < "$work/git_settings.sh") GIT_CONFIG lines in the template:check-update task, expected 3 that start with \"export GIT_CONFIG_COUNT=\" and end with \"export GIT_CONFIG_KEY_1=\"." >&2
  exit 1
fi
maintenance_repo=$work/maintenance_repo
git init --quiet "$maintenance_repo"
echo "from the template" > "$maintenance_repo/tracked_file"
git -C "$maintenance_repo" add tracked_file
(
  source "$work/git_settings.sh"
  GIT_TRACE2_EVENT=$work/maintenance_trace git -C "$maintenance_repo" \
    -c user.name=template-test -c user.email=template-test@localhost \
    commit --quiet --message "Create the project"
)
if [[ ! -s $work/maintenance_trace ]]; then
  echo "FAIL: $name: git wrote no trace of the commit to $work/maintenance_trace, so the check could not run." >&2
  exit 1
fi
if grep -q '"maintenance"' "$work/maintenance_trace"; then
  echo "FAIL: $name: a commit with the task's git settings still ran git maintenance; the trace is $work/maintenance_trace." >&2
  exit 1
fi
echo "$name: passed."
'''
