# The template's own tasks, which mise loads along with mise.toml. Only the
# template repository has this file: copier.yml leaves it out of projects.

[tasks."template:check"]
description = "Check that the project Copier creates with every language equals the repository root, apart from the template's own files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT

# --vcs-ref=HEAD makes copier read the working tree, including uncommitted
# changes and untracked files that git doesn't ignore.
copier copy --quiet --defaults --vcs-ref=HEAD \
  --data python=true --data rust=true --data typescript=true --data cpp=true \
  . "$work/project"
rm "$work/project/.copier-answers.yml"

# Copy the files copier read, except the template's own files, which
# _exclude in copier.yml also lists, and templates (*.jinja), which the
# project has rendered instead.
mkdir "$work/root"
git ls-files --cached --others --exclude-standard | sort -u | while read -r file; do
  case $file in
    copier.yml | .config/mise/conf.d/template.toml | .github/workflows/template.yml | .github/rulesets/template-checks.json | *.jinja) ;;
    *) if [[ -e $file ]]; then printf '%s\n' "$file"; fi ;;
  esac
done | tar -cf - -T - | tar -xf - -C "$work/root"

if ! diff -r "$work/root" "$work/project"; then
  echo "error: the project Copier creates with every language differs from the repository root as shown above (root first), but the root must be that project. List a file only the root has in _exclude in copier.yml and in this task in .config/mise/conf.d/template.toml; for a file with a .jinja twin, edit the twin and run \`mise run template:sync\`." >&2
  exit 1
fi
echo "The project Copier creates with every language equals the repository root, apart from the template's own files."
'''

[tasks."template:sync"]
description = "Render each .jinja twin with every language into its root copy, such as AGENTS.md.jinja into AGENTS.md"
run = '''
#!/usr/bin/env bash
set -euo pipefail
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
copier copy --quiet --defaults --vcs-ref=HEAD \
  --data python=true --data rust=true --data typescript=true --data cpp=true \
  . "$work/project"

# A twin is a .jinja file whose root copy exists; the answers file's
# template has none.
git ls-files --cached --others --exclude-standard '*.jinja' | while read -r twin; do
  root_copy=${twin%.jinja}
  if [[ -e $root_copy ]]; then
    cp "$work/project/$root_copy" "$root_copy"
    echo "Rendered $twin into $root_copy."
  fi
done
'''

[tasks."lint:template"]
description = "Run template:check, so that lint and check include it"
depends = ["template:check"]

[tasks."test:template"]
description = "Check that Copier refuses a project with no language and writes nothing, and that a project with one language has only that language's files, names, and Dependabot entries"
run = '''
#!/usr/bin/env bash
set -euo pipefail
work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
name=copier_refuses_a_project_with_no_language_and_writes_nothing

status=0
copier copy --quiet --defaults --vcs-ref=HEAD \
  --data python=false --data rust=false --data typescript=false --data cpp=false \
  . "$work/project" 2> "$work/stderr" || status=$?
if ((status == 0)) || ! grep -q "No language was chosen" "$work/stderr"; then
  echo "FAIL: $name: copier exited with status $status and printed the output below; expected a non-zero status and the error from the validator of cpp in copier.yml." >&2
  cat "$work/stderr" >&2
  exit 1
fi
if [[ -e $work/project ]]; then
  echo "FAIL: $name: copier refused, but wrote $work/project." >&2
  exit 1
fi
echo "$name: passed."

# What each language adds to a project: its files, which _exclude in
# copier.yml leaves out of a project without it (keep each list equal to its
# block there), its name in AGENTS.md and README.md, and its entries in
# .github/dependabot.yml.
language_files() {
  case $1 in
    python) echo pyproject.toml uv.lock .python-version src tests .config/mise/conf.d/python.toml docs/api/python.md ;;
    rust) echo Cargo.toml Cargo.lock rust-toolchain.toml crates .config/mise/conf.d/rust.toml docs/api/rust.md .github/workflows/rust-advisories.yml ;;
    typescript) echo package.json pnpm-lock.yaml pnpm-workspace.yaml packages tsconfig.json biome.json .dependency-cruiser.cjs stryker.config.json .config/mise/conf.d/typescript.toml docs/api/typescript.md ;;
    cpp) echo CMakeLists.txt cpp CMakePresets.json .clang-format .clang-tidy Doxyfile .config/mise/conf.d/cpp.toml docs/api/cpp.md ;;
  esac
}
language_name() {
  case $1 in
    python) echo Python ;;
    rust) echo Rust ;;
    typescript) echo TypeScript ;;
    cpp) echo C++ ;;
  esac
}
language_dependabot_entries() {
  case $1 in
    python) echo "uv /" ;;
    rust) printf '%s\n' "cargo /" "rust-toolchain /" ;;
    typescript) echo "npm /" ;;
  esac
}

# Prints each entry of a dependabot.yml as "<ecosystem> <directory>", one
# line per directory, sorted.
dependabot_entries() {
  awk '
    $2 == "package-ecosystem:" { ecosystem = $3 }
    $1 == "directory:" { print ecosystem, $2 }
    $1 == "directories:" { gsub(/[][,]/, ""); for (i = 2; i <= NF; i++) print ecosystem, $i }
  ' "$1" | sort
}

name=a_single_language_project_has_only_its_language_files_names_and_dependabot_entries
languages="python rust typescript cpp"
for language in $languages; do
  project=$work/$language
  copier copy --quiet --defaults --vcs-ref=HEAD --data "$language=true" . "$project"
  for path in $(language_files "$language"); do
    if [[ ! -e $project/$path ]]; then
      echo "FAIL: $name: the $language project lacks $path, one of its own files." >&2
      exit 1
    fi
  done
  for other in $languages; do
    if [[ $other == "$language" ]]; then continue; fi
    for path in $(language_files "$other"); do
      if [[ -e $project/$path ]]; then
        echo "FAIL: $name: the $language project has $path, a file of $other. Add it to the $other block of _exclude in copier.yml." >&2
        exit 1
      fi
    done
    if grep -nF "$(language_name "$other")" "$project/AGENTS.md" "$project/README.md" >&2; then
      echo "FAIL: $name: the $language project's AGENTS.md or README.md names $(language_name "$other") on the lines above. Put those lines inside an if block for $other in the .jinja twin." >&2
      exit 1
    fi
  done
  expected_entries=$({ printf '%s\n' "github-actions /" "uv /docs"; language_dependabot_entries "$language"; } | sort)
  actual_entries=$(dependabot_entries "$project/.github/dependabot.yml")
  if [[ $actual_entries != "$expected_entries" ]]; then
    printf "FAIL: %s: the %s project's .github/dependabot.yml has these entries:\n%s\nIt should have these:\n%s\n" "$name" "$language" "$actual_entries" "$expected_entries" >&2
    exit 1
  fi
done
echo "$name: passed."
'''
