# Copier's settings for creating a project from this repository (decision D1
# in docs/template-plan.md); .github/README.md says how. The repository root
# is the project with every language, named foundation. The first questions
# name the project, its owner, its repository, and its copyright holder, and
# each question after them adds one language; _exclude leaves out the files of
# each language a project doesn't use. AGENTS.md, README.md, NOTICE,
# .github/CODEOWNERS, and .github/dependabot.yml are rendered from their
# .jinja twins; edit the twin, then run `mise run template:sync` to render the
# root copy. _tasks puts the project's name in the other files that carry it.
# The tasks in .config/mise/conf.d/template.toml check all of this, and
# .github/workflows/template.yml runs them and `mise run check` in a project
# with every language and in one with each language alone.

# Removes the line break after a {% ... %} tag and the indentation before
# it, so that a tag on a line of its own leaves no blank line.
_envops:
  trim_blocks: true
  lstrip_blocks: true

# The default is the root's name, so that a project created before this
# question existed keeps its files' names when `copier update --defaults`
# first asks it.
project_name:
  type: str
  default: foundation
  help: >-
    Project name, in lowercase kebab-case, such as my-project? It names the
    Python distribution, the Rust crate, the TypeScript packages' npm scope,
    the CMake project, and the docs site.
  validator: >-
    {% set letters_and_digits = project_name.replace("-", "") %}
    {% set is_kebab_case = letters_and_digits.isascii()
      and letters_and_digits.isalnum() and project_name == project_name.lower()
      and project_name[:1].isalpha() and "--" not in project_name
      and not project_name.endswith("-") %}
    {% if not is_kebab_case %}
    The project name "{{ project_name }}" is not lowercase kebab-case: give
    lowercase letters and digits in words joined by single hyphens, starting
    with a letter, such as my-project.
    {% endif %}

package_name:
  type: str
  default: "{{ project_name | replace('-', '_') }}"
  help: >-
    Package name, in lowercase snake_case? It names the Python import
    package, the Rust library, and the C++ namespace and include directory.
  validator: >-
    {% set letters_and_digits = package_name.replace("_", "") %}
    {% set is_snake_case = letters_and_digits.isascii()
      and letters_and_digits.isalnum() and package_name == package_name.lower()
      and package_name[:1].isalpha() and "__" not in package_name
      and not package_name.endswith("_") %}
    {% if not is_snake_case %}
    The package name "{{ package_name }}" is not lowercase snake_case: give
    lowercase letters and digits in words joined by single underscores,
    starting with a letter, such as my_project.
    {% endif %}

# The defaults are the root's, as for project_name.
github_owner:
  type: str
  default: arjunbhargava
  help: >-
    GitHub user or team, such as octocat or my-org/maintainers, who must
    review changes to the paths that .github/CODEOWNERS lists?
  validator: >-
    {% set name_characters = github_owner.replace("-", "").replace("/", "").replace("_", "") %}
    {% set is_user_or_team = name_characters.isascii()
      and name_characters.isalnum() and github_owner.count("/") <= 1
      and github_owner[:1].isalnum() %}
    {% if not is_user_or_team %}
    The GitHub owner "{{ github_owner }}" is not a GitHub user or team: give
    a user name such as octocat, or a team as org/team, without the @.
    {% endif %}

# The repository's name can differ from project_name, so it is a question of
# its own. A team's owner is its organization, the part before the /.
github_repository:
  type: str
  default: "{{ github_owner.split('/')[0] }}/{{ project_name }}"
  help: >-
    GitHub repository, as owner/name, such as octocat/my-project? The
    README's links to the repository's settings name it.
  validator: >-
    {% set name_characters = github_repository.replace("-", "").replace("_", "").replace(".", "").replace("/", "") %}
    {% set is_owner_and_name = name_characters.isascii()
      and name_characters.isalnum() and github_repository.count("/") == 1
      and not github_repository.startswith("/") and not github_repository.endswith("/") %}
    {% if not is_owner_and_name %}
    The GitHub repository "{{ github_repository }}" is not owner/name: give
    it as octocat/my-project.
    {% endif %}

copyright_holder:
  type: str
  default: Arjun
  help: Copyright holder that NOTICE names, such as a person or a company?
  validator: >-
    {% if not copyright_holder.strip() %}
    The copyright holder is empty: give the person or company that holds
    the copyright, such as --data "copyright_holder=Jane Doe".
    {% endif %}

copyright_year:
  type: str
  default: "2026"
  help: Year that NOTICE gives for the copyright, such as 2027?
  validator: >-
    {% set is_year = copyright_year.isdigit() and copyright_year | length == 4 %}
    {% if not is_year %}
    The copyright year "{{ copyright_year }}" is not a four-digit year, such
    as 2027.
    {% endif %}

# Not a question: true only when template:check and template:sync render the
# repository root, so that the root's .github/CODEOWNERS also lists the files
# only the template has. Copier neither asks nor records it.
template_repository:
  type: bool
  when: false
  default: false

python:
  type: bool
  default: false
  help: Use Python?

rust:
  type: bool
  default: false
  help: Use Rust?

typescript:
  type: bool
  default: false
  help: Use TypeScript?

cpp:
  type: bool
  default: false
  help: Use C and C++?
  # This question is the last, so the validator sees every answer. Without a
  # language, the docs build fails, because its API pages are the languages'
  # pages.
  validator: >-
    {% if not (python or rust or typescript or cpp) %}
    No language was chosen. Answer yes for at least one of python, rust,
    typescript, and cpp, for example with --data python=true.
    {% endif %}

# Not a question: the chosen languages' names as one phrase, such as "Python
# and Rust", for the .jinja twins. Copier neither asks nor records it.
language_names:
  type: str
  when: false
  default: >-
    {%- set names = [] -%}
    {%- if python %}{% set names = names + ["Python"] %}{% endif -%}
    {%- if rust %}{% set names = names + ["Rust"] %}{% endif -%}
    {%- if typescript %}{% set names = names + ["TypeScript"] %}{% endif -%}
    {%- if cpp %}{% set names = names + ["C and C++"] %}{% endif -%}
    {%- if names | length > 2 -%}
    {{ names[:-1] | join(", ") }}, and {{ names[-1] }}
    {%- else -%}
    {{ names | join(" and ") }}
    {%- endif -%}

# Puts the project's name in each file and directory that carries the root's
# name, foundation, apart from the .jinja twins. A twin can't rename a
# directory, and Dependabot edits pyproject.toml and the lockfiles, so a twin
# of one would fall behind its root copy. A distribution, crate, npm scope,
# CMake project, or docs title takes project_name, and an identifier takes
# package_name. Copier runs this in the project after each copy and update,
# so it must work on a project it has already renamed. test:template checks
# that a renamed project has no name left over; add each new file that names
# the project here. Copier runs tasks only when given --trust.
_tasks:
  - when: "{{ project_name != 'foundation' or package_name != 'foundation' }}"
    command: |
      set -eu

      # edit <file> <sed arguments>: edit the file in place, if the project
      # has it. Each `-e t` ends a line's edits after a replacement, so the
      # next pattern can't match the name just written.
      edit() {
        file=$1
        shift
        if [ -e "$file" ]; then
          sed "$@" "$file" > "$file.renamed"
          mv "$file.renamed" "$file"
        fi
      }

      # move_directory <from> <to>: on copier update, <to> already holds the
      # project's files, and Copier has just written the template's into
      # <from>, so this merges them. A name left as foundation leaves its
      # directory alone.
      move_directory() {
        if [ -d "$1" ] && [ "$1" != "$2" ]; then
          mkdir -p "$2"
          cp -R "$1/." "$2/"
          rm -rf "$1"
        fi
      }

      edit pyproject.toml -e 's/^name = "foundation"$/name = "{{ project_name }}"/' -e t -e 's/foundation/{{ package_name }}/g'
      edit uv.lock -e 's/^name = "foundation"$/name = "{{ project_name }}"/'
      edit tests/test_quadrature.py -e 's/foundation/{{ package_name }}/g'
      edit docs/api/python.md -e 's/foundation/{{ package_name }}/g'

      # ponytail: renaming the package in Cargo.lock in place keeps it
      # valid while the lockfile has no other package; with dependencies,
      # cargo sorts packages by name, and `cargo --locked` would fail. Then
      # relock here with `cargo update --workspace --offline`.
      edit Cargo.toml -e 's|"crates/foundation"|"crates/{{ project_name }}"|'
      edit Cargo.lock -e 's/^name = "foundation"$/name = "{{ project_name }}"/'
      edit crates/foundation/Cargo.toml -e '1,/^name = /s/"foundation"/"{{ project_name }}"/' -e t -e 's/"foundation"/"{{ package_name }}"/'
      edit crates/foundation/src/verlet.rs -e 's/foundation/{{ package_name }}/g'
      edit crates/foundation/tests/verlet.rs -e 's/foundation/{{ package_name }}/g'
      edit docs/api/rust.md -e 's/foundation/{{ package_name }}/g'

      edit packages/statistics/package.json -e 's|"@foundation/|"@{{ project_name }}/|'

      edit CMakeLists.txt -e 's/^project(foundation /project({{ project_name }} /'
      edit cpp/include/foundation/interpolation.hpp -e 's/foundation/{{ package_name }}/g'
      edit cpp/src/interpolation.cpp -e 's/foundation/{{ package_name }}/g'
      edit cpp/tests/interpolation_test.cpp -e 's/foundation/{{ package_name }}/g'
      edit .config/mise/conf.d/cpp.toml -e 's|foundation/interpolation.hpp|{{ package_name }}/interpolation.hpp|'
      edit docs/api/cpp.md -e 's/foundation/{{ package_name }}/g'

      edit docs/conf.py -e 's/"foundation"/"{{ project_name }}"/g'
      edit docs/index.md -e 's/^# foundation$/# {{ project_name }}/'

      move_directory src/foundation src/{{ package_name }}
      move_directory crates/foundation crates/{{ project_name }}
      move_directory cpp/include/foundation cpp/include/{{ package_name }}

_exclude:
  # Copier's defaults, which setting _exclude replaces.
  - copier.yml
  - copier.yaml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  # The template's own files: its checks, its README (which GitHub shows in
  # place of README.md; README.md.jinja renders each project's), and its plan
  # (docs/index.md lists it in no toctree, so a project's docs build passes
  # without it). Keep this list equal to the one in template:check in
  # .config/mise/conf.d/template.toml.
  - /.config/mise/conf.d/template.toml
  - /.github/workflows/template.yml
  - /.github/rulesets/template-checks.json
  - /.github/README.md
  - /docs/template-plan.md
  - /docs/template-open-items.md
  # Each language's files: its manifest and the files listed with it in the
  # changes job of .github/workflows/ci.yml, its API page, and its workflows.
  # Keep each block equal to the language's list in test:template.
  # Each line of a block is one pattern. A leading / matches only at the
  # root, so that /tests leaves cpp/tests alone, and /uv.lock docs/uv.lock.
  - |
    {% if not python %}
    /pyproject.toml
    /uv.lock
    /.python-version
    /conftest.py
    /src
    /tests
    /.config/mise/conf.d/python.toml
    /docs/api/python.md
    {% endif %}
  - |
    {% if not rust %}
    /Cargo.toml
    /Cargo.lock
    /rust-toolchain.toml
    /crates
    /.config/mise/conf.d/rust.toml
    /docs/api/rust.md
    /.github/workflows/rust-advisories.yml
    {% endif %}
  - |
    {% if not typescript %}
    /package.json
    /pnpm-lock.yaml
    /pnpm-workspace.yaml
    /packages
    /tsconfig.json
    /biome.json
    /.dependency-cruiser.cjs
    /stryker.config.json
    /.config/mise/conf.d/typescript.toml
    /docs/api/typescript.md
    {% endif %}
  - |
    {% if not cpp %}
    /CMakeLists.txt
    /cpp
    /CMakePresets.json
    /.clang-format
    /.clang-tidy
    /Doxyfile
    /.config/mise/conf.d/cpp.toml
    /docs/api/cpp.md
    {% endif %}
