[project]
name = "foundation"
version = "0.1.0"
description = "The template's example Python package."
requires-python = "==3.14.*"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The import package in src/. Without this, uv_build derives it from the
# project's name, and the template's package_name question may differ.
module-name = "foundation"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mutmut>=3.8.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
]

[tool.ruff]
# People write .cursor/ (AGENTS.md), and ruff formats the Python blocks in its
# Markdown.
extend-exclude = [".cursor"]

[tool.ruff.lint]
extend-select = ["D"]
ignore = ["D107"]

[tool.ruff.lint.per-file-ignores]
# Tests aren't API reference; their names state the behaviour they check.
"tests/**" = ["D"]
".github/scripts/*_test.py" = ["D"]
"docs/*_test.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
typeCheckingMode = "strict"
# mutants/ is mutmut's generated copy of a distribution's src/. Setting
# exclude replaces pyright's defaults, so the other three entries restore them.
exclude = ["**/mutants", "**/node_modules", "**/__pycache__", "**/.*"]

# Module boundaries, which `mise run lint:python` checks with lint-imports.
# Add a contract for each rule:
# https://import-linter.readthedocs.io/en/stable/contract_types.html
[tool.importlinter]
root_package = "foundation"
# Lets a contract name a package from outside foundation, such as pytest.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Library code doesn't import pytest, a development-only dependency"
type = "forbidden"
source_modules = ["foundation"]
forbidden_modules = ["pytest"]

[tool.pytest]
# -n auto runs tests in parallel, so a test that depends on shared state or on
# another test's order fails early instead of intermittently later.
addopts = ["-n", "auto", "--doctest-modules"]
testpaths = ["src", "tests", ".github/scripts"]
strict = true
filterwarnings = ["error"]

[tool.mutmut]
# mutmut takes one src/ per run, and guesses lib/ before src/ in a directory
# that has both, as the root of a workspace with a member in lib/ does.
# .github/scripts/mutate.sh runs mutmut in each distribution's directory. A
# member needs no [tool.mutmut] unless it has a lib/ directory of its own.
source_paths = ["src"]
