[project]
name = "foundation"
version = "0.1.0"
description = "The template's example Python package."
requires-python = "==3.14.*"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
    "sphinx>=9.1.0",
    "sphinx-autoapi>=3.8.1",
]

[tool.ruff]
# People write .cursor/ (AGENTS.md), and its conf.py is a template to copy.
extend-exclude = [".cursor"]

[tool.ruff.lint]
extend-select = ["D"]
ignore = ["D107"]

[tool.ruff.lint.per-file-ignores]
# Tests aren't API reference; their names state the behaviour they check.
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
typeCheckingMode = "strict"

[tool.pytest]
# -n auto runs tests in parallel, so a test that depends on shared state or on
# another test's order fails early instead of intermittently later.
addopts = ["-n", "auto", "--doctest-modules"]
testpaths = ["src", "tests"]
strict = true
filterwarnings = ["error"]
