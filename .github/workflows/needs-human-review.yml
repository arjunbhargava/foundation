# Fails a PR that has the needs-human-review label, so that, once the
# auto-mode ruleset requires this check, only the owner's bypass merges it,
# even after the approval workflow has approved it (docs/auto-mode.md).
# pull_request_target runs the base branch's copy of this file, so a PR can't
# change the check that judges it. No code from the PR runs.
name: Needs human review

on:
  # zizmor flags every pull_request_target, because checking out a PR with it
  # runs the PR's code with the job's token; this job checks out nothing.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

defaults:
  run:
    # Naming bash explicitly adds -o pipefail, which the default shell lacks.
    shell: bash

jobs:
  # The job has no if: GitHub counts a skipped job as a passing check.
  needs-human-review:
    # One run at a time per PR, in event order, so the check's latest result
    # matches the label's latest state when it is added and removed quickly.
    concurrency:
      group: needs-human-review-${{ github.event.pull_request.number }}
    runs-on: ubuntu-latest
    steps:
      - env:
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'needs-human-review') }}
        run: |
          if [[ $HAS_LABEL == true ]]; then
            echo "error: this PR has the needs-human-review label, so only the owner merges it, with the admin bypass. Removing the label lets auto mode merge it." >&2
            exit 1
          fi
          echo "This PR has no needs-human-review label."
