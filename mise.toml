# Pinned tool versions and the shared commands that people, agents, and CI run,
# for example `mise run check`. Each language task (Stage 2 of
# docs/template-plan.md) pins its tools under [tools]; adds `lint:<language>`,
# `test:<language>`, and, if it has dependencies to install,
# `setup:<language>` tasks, which `lint`, `test`, and `setup` pick up; and adds
# its commands to `fmt`. Python packages, including ruff and pyright, are
# pinned in uv.lock rather than here, TypeScript packages, including tsc,
# Biome, and vitest, in pnpm-lock.yaml, and the Rust toolchain in
# rust-toolchain.toml.

[settings]
# Installs the Rust toolchain that rust-toolchain.toml names, with rustup.
idiomatic_version_file_enable_tools = ["rust"]

# Dependabot can't read this file, so bump these pins by hand, to a version
# that `mise ls-remote <tool>` lists. Only versions are pinned here: mise
# checks the tools it downloads from GitHub releases against GitHub's digest
# for the asset, and Node against its signed SHASUMS256.txt. mise's own
# version and checksums are pinned in .cursor/install.sh.
#
# Each CI job installs only the tools its MISE_ENABLE_TOOLS names in
# .github/workflows/ci.yml, so add a new tool to every job that runs it. A job
# that runs a tool it doesn't list fails, with an error naming the tool.
[tools]
cargo-deny = "0.20.2"
jq = "1.8.2" # .github/rulesets/apply.sh
node = "24.21.0"
pnpm = "12.8.1" # The only pin: package.json has no packageManager field.
# Move pyproject.toml's uv_build range with this pin. Outside that range, uv
# fetches uv_build from PyPI instead of building with its built-in copy.
uv = "0.12.21"
# C and C++. The compiler, g++, comes from the OS; see AGENTS.md.
cmake = "4.4.3"
ninja = "1.13.2"
# The PyPI wheels: self-contained, with clang's built-in headers, which
# clang-tidy needs. Keep both on one LLVM version.
"pipx:clang-format" = "22.1.8"
"pipx:clang-tidy" = "22.1.8"
# From conda-forge, the only source with builds for Linux arm64 and macOS.
"conda:doxygen" = "1.18.0"

[tasks.setup]
description = "Install project dependencies"
depends = ["setup:*"]

# Each setup task fails if the language's lockfile is out of date with its
# manifest, so CI catches a manifest edited without relocking.
[tasks."setup:python"]
description = "Install the Python dependencies that uv.lock pins"
run = "uv sync --locked"

[tasks."setup:rust"]
description = "Download the Rust dependencies that Cargo.lock pins"
run = "cargo fetch --locked"

[tasks."setup:typescript"]
description = "Install the TypeScript dependencies that pnpm-lock.yaml pins"
run = "pnpm install --frozen-lockfile"

[tasks.fmt]
description = "Format all code in place"
run = [
  "uv run ruff format",
  "cargo fmt",
  # check rather than format, so imports are sorted too, as lint:typescript
  # requires. Lint fixes are left to the author.
  "pnpm exec biome check --write --linter-enabled=false",
  'find cpp -name "*.[ch]" -o -name "*.[ch]pp" | xargs clang-format -i',
]

[tasks.lint]
description = "Check formatting, lint, and types without changing files"
depends = ["lint:*"]

[tasks."lint:python"]
description = "Check Python formatting, lint including docstrings, types, and module boundaries"
run = [
  "uv run ruff format --check",
  "uv run ruff check",
  "uv run pyright --warnings",
  "uv run lint-imports",
]

[tasks."lint:rust"]
description = "Check Rust formatting, lint including doc comments, and dependencies' advisories, bans, licences, and sources"
run = [
  "cargo fmt --check",
  "cargo clippy --locked --all-targets -- -D warnings",
  "cargo deny --locked check advisories bans licenses sources",
]

[tasks."lint:typescript"]
description = "Check TypeScript formatting, lint, types, and module boundaries"
run = [
  "pnpm exec biome ci --error-on-warnings",
  "pnpm exec tsc",
  # err-long prints each broken rule's comment, which says what to do.
  "pnpm exec depcruise packages --output-type err-long",
]

[tasks."lint:cpp"]
description = "Check C and C++ formatting and that no #include uses ../, and build with clang-tidy and compiler warnings as errors"
run = [
  'find cpp -name "*.[ch]" -o -name "*.[ch]pp" | xargs clang-format --dry-run --Werror',
  # CMake keeps a target's PRIVATE include directories, and those of its
  # PRIVATE dependencies, off other targets' search paths. A quoted include
  # with ../ is found relative to the including file instead, so it would
  # reach any header in the repository.
  '''
  if grep -rnE '^[[:space:]]*#[[:space:]]*include[[:space:]]*["<][^">]*\.\./' cpp; then
    echo "error: the #include lines above use ../, which bypasses the include directories CMake gives each target. Include the header by its path under an include directory of a target this one links, such as foundation/interpolation.hpp." >&2
    exit 1
  fi
  ''',
  "cmake --preset clang-tidy",
  "cmake --build --preset clang-tidy",
]

[tasks.test]
description = "Run all tests"
depends = ["test:*"]

[tasks."test:python"]
description = "Run the Python tests and docstring examples; arguments after -- go to pytest"
run = "uv run pytest"

[tasks."test:rust"]
description = "Run the Rust tests and doc-comment examples; arguments after -- go to cargo test"
run = "cargo test --locked"

[tasks."test:typescript"]
description = "Run the TypeScript tests; arguments after -- go to vitest"
# An interrupted mutate:typescript leaves StrykerJS's sandbox, a copy of
# packages/ with mutants in it, in .stryker-tmp/.
run = "pnpm exec vitest run --exclude '.stryker-tmp/**'"

[tasks."test:cpp"]
description = "Build the C and C++ tests with AddressSanitizer and UndefinedBehaviorSanitizer, and run them; arguments after -- go to ctest"
run = [
  "cmake --preset sanitizers",
  "cmake --build --preset sanitizers",
  "ctest --preset sanitizers",
]

[tasks.mutate]
description = "Mutation-test the code changed since the merge base with origin/main, and report each mutant no test caught; check doesn't run it, because it's slow"
depends = ["mutate:*"]

[tasks."mutate:python"]
description = "Mutation-test the changed Python code with mutmut; an argument after -- replaces origin/main as the base"
run = ".github/scripts/mutate.sh python"

[tasks."mutate:rust"]
description = "Mutation-test the changed Rust code with cargo-mutants; an argument after -- replaces origin/main as the base"
# Pinned on this task rather than under [tools], so that only this task
# installs it. cargo-mutants publishes no binary for arm64 Linux or macOS, so
# mise builds it from source with `cargo install --locked`, which takes about
# a minute.
tools = { "cargo:cargo-mutants" = "27.1.0" }
run = ".github/scripts/mutate.sh rust"

[tasks."mutate:typescript"]
description = "Mutation-test the changed TypeScript code with StrykerJS; an argument after -- replaces origin/main as the base"
run = ".github/scripts/mutate.sh typescript"

[tasks."test:mutate-script"]
description = "Check which files .github/scripts/mutate.sh mutates and what it reports, with fake mutation tools"
run = ".github/scripts/mutate_test.sh"

[tasks."test:block-unlisted-tools-script"]
description = "Check that .github/scripts/block_unlisted_tools.sh blocks the tools a job's MISE_ENABLE_TOOLS leaves out"
run = ".github/scripts/block_unlisted_tools_test.sh"

[tasks.docs]
description = "Build the documentation site"
run = "docs/build.sh"

[tasks.check]
description = "Run everything CI runs; must pass before opening a PR"
depends = ["lint", "test", "docs"]
