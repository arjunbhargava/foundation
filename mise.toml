# Pinned tool versions and the shared commands that people, agents, and CI run,
# for example `mise run check`. Each language task (Stage 2 of
# docs/template-plan.md) pins its tools under [tools], adds `lint:<language>`
# and `test:<language>` tasks, which `lint` and `test` pick up, and adds its
# commands to `setup` and `fmt`. Python packages, including ruff and pyright,
# are pinned in uv.lock rather than here, TypeScript packages, including tsc,
# Biome, and vitest, in pnpm-lock.yaml, and the Rust toolchain in
# rust-toolchain.toml.

[settings]
# Installs the Rust toolchain that rust-toolchain.toml names, with rustup.
idiomatic_version_file_enable_tools = ["rust"]

[tools]
cargo-deny = "0.20.2"
jq = "1.8.2" # .github/rulesets/apply.sh
node = "24.21.0"
pnpm = "12.8.1" # The only pin: package.json has no packageManager field.
uv = "0.12.21"
# C and C++. The compiler, g++, comes from the OS; see AGENTS.md.
cmake = "4.4.3"
ninja = "1.13.2"
# The PyPI wheels: self-contained, with clang's built-in headers, which
# clang-tidy needs. Keep both on one LLVM version.
"pipx:clang-format" = "22.1.8"
"pipx:clang-tidy" = "22.1.8"
# From conda-forge, the only source with builds for Linux arm64 and macOS.
"conda:doxygen" = "1.18.0"

[tasks.setup]
description = "Install project dependencies"
run = [
  # --locked fails if uv.lock is out of date with pyproject.toml.
  "uv sync --locked",
  "cargo fetch --locked",
  # --frozen-lockfile fails if pnpm-lock.yaml is out of date with a package.json.
  "pnpm install --frozen-lockfile",
]

[tasks.fmt]
description = "Format all code in place"
run = [
  "uv run ruff format",
  "cargo fmt",
  # check rather than format, so imports are sorted too, as lint:typescript
  # requires. Lint fixes are left to the author.
  "pnpm exec biome check --write --linter-enabled=false",
  'find cpp -name "*.[ch]" -o -name "*.[ch]pp" | xargs clang-format -i',
]

[tasks.lint]
description = "Check formatting, lint, and types without changing files"
depends = ["lint:*"]

[tasks."lint:python"]
description = "Check Python formatting, lint including docstrings, types, and module boundaries"
run = [
  "uv run ruff format --check",
  "uv run ruff check",
  "uv run pyright --warnings",
  "uv run lint-imports",
]

[tasks."lint:rust"]
description = "Check Rust formatting, lint including doc comments, and dependencies' advisories, bans, licences, and sources"
run = [
  "cargo fmt --check",
  "cargo clippy --locked --all-targets -- -D warnings",
  "cargo deny --locked check advisories bans licenses sources",
]

[tasks."lint:typescript"]
description = "Check TypeScript formatting, lint, types, and module boundaries"
run = [
  "pnpm exec biome ci --error-on-warnings",
  "pnpm exec tsc",
  # err-long prints each broken rule's comment, which says what to do.
  "pnpm exec depcruise packages --output-type err-long",
]

[tasks."lint:cpp"]
description = "Check C and C++ formatting and that no #include uses ../, and build with clang-tidy and compiler warnings as errors"
run = [
  'find cpp -name "*.[ch]" -o -name "*.[ch]pp" | xargs clang-format --dry-run --Werror',
  # CMake keeps a target's PRIVATE include directories, and those of its
  # PRIVATE dependencies, off other targets' search paths. A quoted include
  # with ../ is found relative to the including file instead, so it would
  # reach any header in the repository.
  '''
  if grep -rnE '^[[:space:]]*#[[:space:]]*include[[:space:]]*["<][^">]*\.\./' cpp; then
    echo "error: the #include lines above use ../, which bypasses the include directories CMake gives each target. Include the header by its path under an include directory of a target this one links, such as foundation/interpolation.hpp." >&2
    exit 1
  fi
  ''',
  "cmake --preset clang-tidy",
  "cmake --build --preset clang-tidy",
]

[tasks.test]
description = "Run all tests"
depends = ["test:*"]

[tasks."test:python"]
description = "Run the Python tests and docstring examples; arguments after -- go to pytest"
run = "uv run pytest"

[tasks."test:rust"]
description = "Run the Rust tests and doc-comment examples; arguments after -- go to cargo test"
run = "cargo test --locked"

[tasks."test:typescript"]
description = "Run the TypeScript tests; arguments after -- go to vitest"
run = "pnpm exec vitest run"

[tasks."test:cpp"]
description = "Build the C and C++ tests with AddressSanitizer and UndefinedBehaviorSanitizer, and run them; arguments after -- go to ctest"
run = [
  "cmake --preset sanitizers",
  "cmake --build --preset sanitizers",
  "ctest --preset sanitizers",
]

[tasks.docs]
description = "Build the documentation site"
run = "docs/build.sh"

[tasks.check]
description = "Run everything CI runs; must pass before opening a PR"
depends = ["lint", "test", "docs"]
